<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Vocabulary & Grammar Test</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
    background:#1e293b;
    padding:25px;
    border-radius:20px;
}

h1{
    text-align:center;
}

.info{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:20px;
}

.question{
    background:#334155;
    padding:20px;
    margin-top:20px;
    border-radius:15px;
}

.option{
    background:#475569;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    cursor:pointer;
    border:2px solid transparent;
    transition:0.2s;
}

.option:hover{
    background:#64748b;
}

.selected{
    border:2px solid #38bdf8;
    background:#0284c7;
}

.correct{
    background:#16a34a !important;
}

.wrong{
    background:#dc2626 !important;
}

button{
    width:100%;
    padding:15px;
    margin-top:30px;
    font-size:18px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#score{
    text-align:center;
    font-size:32px;
    margin-top:25px;
    font-weight:bold;
}

</style>
</head>
<body>

<div class="container">

<h1>Advanced Vocabulary & Grammar Assessment</h1>

<div class="info">
35 HARD Questions • Randomized Questions • Randomized Answers
</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">Submit Test</button>

<div id="score"></div>

</div>

<script>

const questions = [

{
q:"The prefix in 'subdued' most nearly means:",
o:["Above","Under","Against","Again"],
a:"Under"
},

{
q:"The suffix '-ly' in 'grimly' changes the word into a:",
o:["Noun","Verb","Adjective","Adverb"],
a:"Adverb"
},

{
q:"The prefix 'con-' in 'condescending' means:",
o:["With or together","Against","Under","Apart"],
a:"With or together"
},

{
q:"The suffix '-able' usually means:",
o:["Capable of","Without","Again","Before"],
a:"Capable of"
},

{
q:"Which word contains a prefix meaning 'bad' or 'wrong'?",
o:["Subtle","Despicable","Merely","Reluctantly"],
a:"Despicable"
},

{
q:"What does the suffix '-tion' usually create?",
o:["Verb","Adverb","Noun","Pronoun"],
a:"Noun"
},

{
q:"The root 'spect' means:",
o:["To hear","To see","To write","To move"],
a:"To see"
},

{
q:"Which word best describes someone pretending to be sick?",
o:["Jovial","Feigned","Indignant","Subdued"],
a:"Feigned"
},

{
q:"Which sentence uses 'aloofness' correctly?",
o:[
"His aloofness made him seem distant from the group.",
"The aloofness barked loudly all night.",
"She aloofnessed the paper quickly.",
"We ate aloofness for lunch."
],
a:"His aloofness made him seem distant from the group."
},

{
q:"A person who is jovial is MOST likely:",
o:[
"Cheerful at a party",
"Angry during a game",
"Suspicious of everyone",
"Too weak to move"
],
a:"Cheerful at a party"
},

{
q:"What does the root 'vent' mean in 'venture'?",
o:["To come","To go","To sleep","To hide"],
a:"To go"
},

{
q:"Which word has a suffix meaning 'state or quality'?",
o:["Aloofness","Ponder","Merely","Severe"],
a:"Aloofness"
},

{
q:"Which sentence contains personification?",
o:[
"The wind whispered through the trees.",
"The tree is tall.",
"The car is blue.",
"The boy jumped high."
],
a:"The wind whispered through the trees."
},

{
q:"Which sentence is a metaphor?",
o:[
"The clouds were cotton balls.",
"He runs quickly.",
"The test was difficult.",
"The bell rang loudly."
],
a:"The clouds were cotton balls."
},

{
q:"Which sentence is a simile?",
o:[
"She is a shining star.",
"He fought like a lion.",
"The rain danced softly.",
"The classroom exploded."
],
a:"He fought like a lion."
},

{
q:"Which sentence demonstrates irony?",
o:[
"A police station gets robbed.",
"The cat slept quietly.",
"The teacher graded papers.",
"The rain stopped suddenly."
],
a:"A police station gets robbed."
},

{
q:"Which sentence uses sarcasm?",
o:[
"Fantastic job breaking the vase.",
"The flowers smell sweet.",
"The stars shine brightly.",
"The car is fast."
],
a:"Fantastic job breaking the vase."
},

{
q:"Which sentence contains a euphemism?",
o:[
"He passed away peacefully.",
"He died yesterday.",
"He screamed loudly.",
"He fell down."
],
a:"He passed away peacefully."
},

{
q:"Choose the sentence with correct subject-verb agreement:",
o:[
"Each of the players are ready.",
"Each of the players is ready.",
"The dogs barks loudly.",
"The students was studying."
],
a:"Each of the players is ready."
},

{
q:"Which sentence uses commas correctly?",
o:[
"After the movie, we went home.",
"After the movie we, went home.",
"After, the movie we went home.",
"After the movie we went, home."
],
a:"After the movie, we went home."
},

{
q:"Which sentence correctly uses who/whom?",
o:[
"Whom is calling me?",
"Who are you speaking to?",
"Who did you send the letter to?",
"Whom baked the cookies?"
],
a:"Who did you send the letter to?"
},

{
q:"Which word is an adjective?",
o:["Beautiful","Slowly","Run","Quickly"],
a:"Beautiful"
},

{
q:"Which word is an adverb?",
o:["Carefully","Blue","Strong","Teacher"],
a:"Carefully"
},

{
q:"Which sentence contains an independent clause?",
o:[
"Because it was raining",
"When the bell rang",
"The students studied quietly.",
"After lunch"
],
a:"The students studied quietly."
},

{
q:"Which sentence contains a dependent clause?",
o:[
"She opened the door.",
"Because the storm was severe",
"The dog barked loudly.",
"They finished dinner."
],
a:"Because the storm was severe"
},

{
q:"What does 'indignant' most nearly mean?",
o:[
"Angry over unfair treatment",
"Excited about news",
"Cheerful and friendly",
"Lazy and tired"
],
a:"Angry over unfair treatment"
},

{
q:"Someone moving lethargically is moving:",
o:[
"Quickly",
"Carefully",
"Slowly",
"Excitedly"
],
a:"Slowly"
},

{
q:"Which word best fits: 'The ___ guard watched the castle gates.'",
o:["Sentinel","Jovial","Emaciated","Subtle"],
a:"Sentinel"
},

{
q:"Which sentence uses 'ponder' correctly?",
o:[
"She pondered the difficult question for hours.",
"He pondered across the field quickly.",
"The dog pondered loudly.",
"We ate ponder for dinner."
],
a:"She pondered the difficult question for hours."
},

{
q:"What does the suffix '-ed' in 'feigned' show?",
o:["Future tense","Past tense","Plural form","Comparison"],
a:"Past tense"
},

{
q:"Which word has a prefix meaning 'below'?",
o:["Subtle","Severe","Merely","Jovial"],
a:"Subtle"
},

{
q:"Choose the sentence with proper article usage:",
o:[
"She adopted an unusual cat.",
"She adopted a unusual cat.",
"She adopted unusual cat.",
"She adopted the unusual."
],
a:"She adopted an unusual cat."
},

{
q:"Which sentence correctly uses a semicolon?",
o:[
"I was tired; I went to sleep.",
"I was tired,; I went to sleep.",
"I was tired I; went to sleep.",
"I was tired; because I slept."
],
a:"I was tired; I went to sleep."
},

{
q:"Which sentence contains a pun?",
o:[
"The bicycle could not stand because it was two-tired.",
"The classroom was silent.",
"The rain poured heavily.",
"The stars were bright."
],
a:"The bicycle could not stand because it was two-tired."
},

{
q:"What does 'reluctantly' MOST likely mean?",
o:[
"Eagerly",
"Unwillingly",
"Carelessly",
"Proudly"
],
a:"Unwillingly"
}

];

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

shuffle(questions);

questions.forEach(q=>{
    shuffle(q.o);
});

const quiz = document.getElementById("quiz");

questions.forEach((q,index)=>{

    const div = document.createElement("div");
    div.className = "question";

    let html = `<h3>${index+1}. ${q.q}</h3>`;

    q.o.forEach(option=>{

        html += `
        <div class="option"
        onclick="selectOption(this,${index},'${option.replace(/'/g,"\\'")}')">
        ${option}
        </div>
        `;

    });

    div.innerHTML = html;
    quiz.appendChild(div);

});

const answers = {};

function selectOption(element,qIndex,answer){

    const options = element.parentElement.querySelectorAll(".option");

    options.forEach(opt=>{
        opt.classList.remove("selected");
    });

    element.classList.add("selected");

    answers[qIndex] = answer;
}

function submitQuiz(){

    let score = 0;

    const questionDivs = document.querySelectorAll(".question");

    questions.forEach((q,index)=>{

        const options = questionDivs[index].querySelectorAll(".option");

        options.forEach(option=>{

            if(option.innerText === q.a){
                option.classList.add("correct");
            }

            if(
                answers[index] &&
                option.innerText === answers[index] &&
                answers[index] !== q.a
            ){
                option.classList.add("wrong");
            }

        });

        if(answers[index] === q.a){
            score++;
        }

    });

    document.getElementById("score").innerHTML =
    `Final Score: ${score} / ${questions.length}`;

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });

}

</script>

</body>
</html>
