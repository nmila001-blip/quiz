<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary & Grammar Test</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
}

.container{
    max-width:950px;
    margin:auto;
    background:#1e293b;
    padding:25px;
    border-radius:20px;
}

h1{
    text-align:center;
}

.question{
    background:#334155;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

.option{
    background:#475569;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    cursor:pointer;
    transition:0.2s;
    border:2px solid transparent;
}

.option:hover{
    background:#64748b;
}

.selected{
    border:2px solid #38bdf8;
    background:#0ea5e9;
}

.correct{
    background:#16a34a !important;
}

.wrong{
    background:#dc2626 !important;
}

button{
    width:100%;
    padding:16px;
    margin-top:30px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#score{
    text-align:center;
    font-size:30px;
    margin-top:25px;
    font-weight:bold;
}

.info{
    text-align:center;
    color:#cbd5e1;
}

</style>
</head>
<body>

<div class="container">

<h1>Vocabulary & Grammar Assessment</h1>

<div class="info">
35 Questions • Randomized Question Order • Randomized Answers
</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">Submit Test</button>

<div id="score"></div>

</div>

<script>

const questions = [

{
q:"What does 'admonish' mean?",
o:["To warn or scold","To celebrate","To hide","To relax"],
a:"To warn or scold"
},

{
q:"What does 'aloofness' mean?",
o:["Friendliness","Distance or lack of warmth","Excitement","Humor"],
a:"Distance or lack of warmth"
},

{
q:"What does 'coddle' mean?",
o:["To overprotect","To punish","To ignore","To travel"],
a:"To overprotect"
},

{
q:"What does 'condescending' mean?",
o:["Acting superior","Being nervous","Feeling joyful","Being shy"],
a:"Acting superior"
},

{
q:"What does 'despicable' mean?",
o:["Wonderful","Terrible","Tiny","Quiet"],
a:"Terrible"
},

{
q:"What does 'emaciated' mean?",
o:["Strong","Extremely thin","Energetic","Confused"],
a:"Extremely thin"
},

{
q:"What does 'feigned' mean?",
o:["Pretended","Broken","Loud","Exciting"],
a:"Pretended"
},

{
q:"What does 'grimly' mean?",
o:["Sadly or seriously","Cheerfully","Carelessly","Quickly"],
a:"Sadly or seriously"
},

{
q:"If someone is indignant, they are:",
o:["Excited","Angry about unfairness","Very tired","Confused"],
a:"Angry about unfairness"
},

{
q:"What does 'jovial' mean?",
o:["Happy and cheerful","Angry","Fearful","Suspicious"],
a:"Happy and cheerful"
},

{
q:"What does 'lethargically' mean?",
o:["Slowly and lazily","Energetically","Loudly","Happily"],
a:"Slowly and lazily"
},

{
q:"What does 'merely' mean?",
o:["Only","Always","Never","Rarely"],
a:"Only"
},

{
q:"What does 'ponder' mean?",
o:["To think deeply","To jump","To hide","To yell"],
a:"To think deeply"
},

{
q:"What does 'reluctantly' mean?",
o:["Willingly","Unwillingly","Joyfully","Quickly"],
a:"Unwillingly"
},

{
q:"A sentinel is:",
o:["A guard","A teacher","A chef","A student"],
a:"A guard"
},

{
q:"What does 'severe' mean?",
o:["Harsh or serious","Funny","Tiny","Soft"],
a:"Harsh or serious"
},

{
q:"What does 'subdued' mean?",
o:["Calm and quiet","Wild","Excited","Confused"],
a:"Calm and quiet"
},

{
q:"What does 'subtle' mean?",
o:["Easy to notice","Hard to notice","Bright","Dangerous"],
a:"Hard to notice"
},

{
q:"What does 'suspiciously' mean?",
o:["In a doubtful way","With happiness","With excitement","Without emotion"],
a:"In a doubtful way"
},

{
q:"What does 'venture' mean?",
o:["A risky action or journey","A celebration","A punishment","A lesson"],
a:"A risky action or journey"
},

{
q:"'The classroom was a zoo.' is an example of:",
o:["Metaphor","Simile","Pun","Irony"],
a:"Metaphor"
},

{
q:"'Her smile was as bright as the sun.' is an example of:",
o:["Simile","Pun","Sarcasm","Irony"],
a:"Simile"
},

{
q:"Giving human qualities to objects is:",
o:["Personification","Pun","Clause","Irony"],
a:"Personification"
},

{
q:"A joke using wordplay is called:",
o:["Pun","Metaphor","Simile","Clause"],
a:"Pun"
},

{
q:"Saying 'Nice job' after someone fails badly is:",
o:["Sarcasm","Simile","Pun","Metaphor"],
a:"Sarcasm"
},

{
q:"Which sentence has correct subject-verb agreement?",
o:[
"The dogs bark loudly.",
"The dogs barks loudly.",
"The dog bark loudly.",
"The dog bark yesterday."
],
a:"The dogs bark loudly."
},

{
q:"Choose the correct article:",
o:[
"I saw an elephant.",
"I saw a elephant.",
"I saw elephant.",
"I saw elephantly."
],
a:"I saw an elephant."
},

{
q:"Which sentence uses commas correctly?",
o:[
"After lunch, we played soccer.",
"After lunch we played soccer.",
"After, lunch we played soccer.",
"After lunch we, played soccer."
],
a:"After lunch, we played soccer."
},

{
q:"Which word is a pronoun?",
o:["They","Quickly","Beautiful","Jump"],
a:"They"
},

{
q:"Choose the correct sentence:",
o:[
"Whom did you give it to?",
"Who did you gave it to?",
"Who gave it to whom?",
"Whom gave it to you?"
],
a:"Whom did you give it to?"
},

{
q:"Which is a clause?",
o:[
"because it was raining",
"under the table",
"running quickly",
"bright and sunny"
],
a:"because it was raining"
},

{
q:"Which sentence is grammatically correct?",
o:[
"Everyone is ready.",
"Everyone are ready.",
"Everyone be ready.",
"Everyone ready."
],
a:"Everyone is ready."
},

{
q:"Identify the adjective:",
o:["Blue","Jump","Quickly","Happily"],
a:"Blue"
},

{
q:"Which sentence contains irony?",
o:[
"The fire station burned down.",
"The cat slept.",
"The stars twinkled.",
"The boy ran fast."
],
a:"The fire station burned down."
},

{
q:"Which sentence uses a euphemism?",
o:[
"He passed away.",
"He died.",
"He screamed loudly.",
"He ran quickly."
],
a:"He passed away."
}

];

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

shuffle(questions);

questions.forEach(q=>{
    shuffle(q.o);
});

const quiz = document.getElementById("quiz");

questions.forEach((q,index)=>{

    const div = document.createElement("div");
    div.className = "question";

    let html = `<h3>${index+1}. ${q.q}</h3>`;

    q.o.forEach((option,i)=>{
        html += `
        <div class="option" onclick="selectOption(this,${index},'${option.replace(/'/g,"\\'")}')">
            ${option}
        </div>
        `;
    });

    div.innerHTML = html;
    quiz.appendChild(div);

});

const answers = {};

function selectOption(element,qIndex,answer){

    const options = element.parentElement.querySelectorAll(".option");

    options.forEach(opt=>{
        opt.classList.remove("selected");
    });

    element.classList.add("selected");

    answers[qIndex]=answer;
}

function submitQuiz(){

    let score = 0;

    const questionDivs = document.querySelectorAll(".question");

    questions.forEach((q,index)=>{

        const options = questionDivs[index].querySelectorAll(".option");

        options.forEach(option=>{

            if(option.innerText===q.a){
                option.classList.add("correct");
            }

            if(
                answers[index] &&
                option.innerText===answers[index] &&
                answers[index]!==q.a
            ){
                option.classList.add("wrong");
            }

        });

        if(answers[index]===q.a){
            score++;
        }

    });

    document.getElementById("score").innerHTML =
    `Score: ${score} / ${questions.length}`;

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });

}

</script>

</body>
</html>
